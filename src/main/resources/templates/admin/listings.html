<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Listings - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="flex-grow">

  <!-- Header -->
  <section class="max-w-6xl mx-auto px-6 pt-12 pb-8">

    <p class="text-brown uppercase tracking-[0.2em]
                      text-sm font-semibold mb-3">
      Administration
    </p>

    <h1 class="font-serif text-4xl md:text-5xl
                       font-bold text-forest">
      All Listings
    </h1>

    <p class="text-gray-600 mt-3">
      Review and manage all book listings on the platform.
    </p>

  </section>


  <!-- Listings Table -->
  <section class="max-w-6xl mx-auto px-6 pb-16">

    <div class="bg-white border border-brown/20
                        shadow-sm overflow-hidden">

      <div class="px-6 py-5 border-b border-brown/20">

        <h2 class="font-serif text-2xl font-bold text-forest">
          Book Listings
        </h2>

      </div>


      <div class="overflow-x-auto">

        <table class="w-full text-left">

          <thead class="bg-forest text-white">

          <tr>

            <th class="px-5 py-4 text-sm font-semibold">
              ID
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Book Title
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Owner
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Type
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Status
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Price
            </th>

            <th class="px-5 py-4 text-sm font-semibold">
              Action
            </th>

          </tr>

          </thead>


          <tbody>

          <tr th:each="listing : ${listings}"
              class="border-b border-brown/10
                                   hover:bg-cream/60 transition">

            <td class="px-5 py-4 text-sm"
                th:text="${listing.listingId}">
            </td>

            <td class="px-5 py-4 font-semibold
                                       text-forest"
                th:text="${listing.bookTitle}">
            </td>

            <td class="px-5 py-4 text-sm"
                th:text="${listing.owner.username}">
            </td>

            <td class="px-5 py-4 text-sm"
                th:text="${listing.listingType}">
            </td>

            <td class="px-5 py-4 text-sm"
                th:text="${listing.listingStatus}">
            </td>

            <td class="px-5 py-4 text-sm">

              <span th:text="${listing.price}"></span>

              <span class="text-gray-500">
                                    JD
                                </span>

            </td>


            <!-- Delete -->
            <td class="px-5 py-4">

              <form th:action="@{/admin/listings/{id}/delete(id=${listing.listingId})}"
                    method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        data-confirm="Are you sure you want to delete this listing?"
                        class="border border-red-700
                                                   text-red-700 px-4 py-2
                                                   text-sm font-semibold
                                                   hover:bg-red-700
                                                   hover:text-white
                                                   transition">
                  Delete
                </button>

              </form>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </section>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
