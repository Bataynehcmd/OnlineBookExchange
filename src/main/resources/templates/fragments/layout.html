<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">
        Book Exchange
    </title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Project Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F5F1E8',
                        forest: '#243B2F',
                        brown: '#8B6F47',
                        gold: '#B08D57',
                        ink: '#292722'
                    }
                }
            }
        }
    </script>


    <!-- Global JavaScript -->
    <script th:src="@{/js/main.js}"></script>

</head>

</html>
