<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Send Message - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="flex-grow">

  <!-- Header -->
  <section class="max-w-3xl mx-auto px-6 pt-12 pb-8">

    <p class="text-brown uppercase tracking-[0.2em]
                      text-sm font-semibold mb-3">
      Contact Seller
    </p>

    <h1 class="font-serif text-4xl md:text-5xl
                       font-bold text-forest">
      Send Message
    </h1>

    <p class="text-gray-600 mt-3">
      Send a message to the owner of this book listing.
    </p>

  </section>


  <!-- Message Form -->
  <section class="max-w-3xl mx-auto px-6 pb-16">

    <div class="bg-white border border-brown/20
                        shadow-sm p-8 md:p-10">

      <form id="messageForm"
            th:action="@{/message}"
            method="post"
            class="space-y-6">

        <!-- Listing ID -->
        <input type="hidden"
               name="listingId"
               th:value="${listingId}">


        <!-- Message -->
        <div>

          <label for="messageText"
                 class="block text-sm font-semibold
                                      text-forest mb-2">
            Message
          </label>

          <textarea id="messageText"
                    name="messageText"
                    rows="7"
                    maxlength="1000"
                    required
                    placeholder="Write your message here..."
                    class="w-full border border-brown/30
                                         bg-cream px-4 py-3
                                         text-ink outline-none
                                         resize-y
                                         focus:border-forest transition"></textarea>

          <div class="flex justify-between
                                    items-center mt-2">

            <p class="text-sm text-gray-500">
              Keep your message clear and respectful.
            </p>

            <span id="characterCount"
                  class="text-sm text-gray-500">
                                0 characters
                            </span>

          </div>

        </div>


        <!-- Actions -->
        <div class="border-t border-brown/20
                                pt-6 flex flex-col sm:flex-row gap-3">

          <button type="submit"
                  class="flex-1 bg-forest text-white
                                       py-3 font-semibold
                                       border border-forest
                                       hover:bg-brown
                                       hover:border-brown transition">
            Send Message
          </button>

          <a th:href="@{/listings/all}"
             class="flex-1 text-center
                                  border border-brown
                                  text-brown py-3 font-semibold
                                  hover:bg-brown
                                  hover:text-white transition">
            Cancel
          </a>

        </div>

      </form>

    </div>

  </section>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Message JavaScript -->
<script th:src="@{/js/messages.js}"></script>

</body>
</html>
