<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('My Listings - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="flex-grow">

    <!-- Header -->
    <section class="max-w-6xl mx-auto px-6 pt-12 pb-8">

        <p class="text-brown uppercase tracking-[0.2em]
                      text-sm font-semibold mb-3">
            Your Books
        </p>

        <h1 class="font-serif text-4xl md:text-5xl
                       font-bold text-forest">
            My Listings
        </h1>

        <p class="text-gray-600 mt-3">
            Manage the books you have listed on the platform.
        </p>

    </section>


    <!-- Listings -->
    <section class="max-w-6xl mx-auto px-6 pb-16">

        <!-- Empty State -->
        <div th:if="${listings.isEmpty()}"
             class="bg-white border border-brown/20
                        shadow-sm p-10 text-center">

            <div class="text-5xl mb-4">
                📚
            </div>

            <h2 class="font-serif text-2xl font-bold text-forest">
                You have no listings yet
            </h2>

            <p class="text-gray-600 mt-2 mb-6">
                List a book and make it available to other students.
            </p>

            <a th:href="@{/listings}"
               class="inline-block bg-forest text-white
                          px-6 py-3 font-semibold
                          hover:bg-brown transition">
                List a Book
            </a>

        </div>


        <!-- Book Grid -->
        <div th:unless="${listings.isEmpty()}"
             class="grid md:grid-cols-2 lg:grid-cols-3 gap-7">

            <div th:each="listing : ${listings}"
                 class="bg-white border border-brown/20
                            shadow-sm overflow-hidden">

                <!-- Image -->
                <div class="bg-gray-100 h-56 flex items-center
                                justify-center">

                    <img th:if="${listing.image != null}"
                         th:src="@{/listings/{id}/image(id=${listing.listingId})}"
                         alt="Book Image"
                         class="w-full h-full object-cover">

                    <div th:unless="${listing.image != null}"
                         class="text-gray-400 text-center">

                        <div class="text-5xl mb-2">
                            📖
                        </div>

                        <p class="text-sm">
                            No image available
                        </p>

                    </div>

                </div>


                <!-- Information -->
                <div class="p-6">

                    <div class="flex items-start justify-between
                                    gap-3 mb-4">

                        <h2 class="font-serif text-2xl font-bold
                                       text-forest"
                            th:text="${listing.bookTitle}">
                        </h2>

                        <span th:text="${listing.listingType}"
                              class="text-xs font-bold
                                         border border-gold
                                         text-brown px-2 py-1
                                         whitespace-nowrap">
                            </span>

                    </div>


                    <div class="space-y-2 text-sm text-gray-600">

                        <p>
                            <strong class="text-ink">Author:</strong>
                            <span th:text="${listing.author}"></span>
                        </p>

                        <p>
                            <strong class="text-ink">Edition:</strong>
                            <span th:text="${listing.edition}"></span>
                        </p>

                        <p>
                            <strong class="text-ink">Course Code:</strong>
                            <span th:text="${listing.courseCode}"></span>
                        </p>

                        <p>
                            <strong class="text-ink">Category:</strong>
                            <span th:text="${listing.category}"></span>
                        </p>

                        <p>
                            <strong class="text-ink">Condition:</strong>
                            <span th:text="${listing.condition}"></span>
                        </p>

                    </div>


                    <!-- Price -->
                    <div th:if="${listing.listingType.name() == 'SELL'}"
                         class="border-t border-brown/20
                                    mt-5 pt-4">

                        <p class="text-xl font-bold text-forest">

                            <span th:text="${listing.price}"></span>

                            <span class="text-sm font-normal
                                             text-gray-500">
                                    JD
                                </span>

                        </p>

                    </div>


                    <!-- Status -->
                    <div class="mt-5">

                            <span class="text-sm font-semibold
                                         text-brown">
                                Status:
                            </span>

                        <span th:text="${listing.listingStatus}"
                              class="text-sm text-gray-700">
                            </span>

                    </div>


                    <!-- Actions -->
                    <div th:if="${listing.listingStatus.name() == 'AVAILABLE'}"
                         class="border-t border-brown/20
                                    mt-5 pt-5 flex gap-3">

                        <!-- Edit -->
                        <a th:href="@{/listings/{id}/edit-listing(id=${listing.listingId})}"
                           class="flex-1 text-center
                                      border border-forest
                                      text-forest py-2.5
                                      font-semibold
                                      hover:bg-forest
                                      hover:text-white transition">
                            Edit
                        </a>


                        <!-- Delete -->
                        <form th:action="@{/listings/{id}/delete(id=${listing.listingId})}"
                              method="post"
                              class="flex-1">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    data-confirm="Are you sure you want to delete this listing?"
                                    class="w-full border border-red-700
                                               text-red-700 py-2.5
                                               font-semibold
                                               hover:bg-red-700
                                               hover:text-white transition">
                                Delete
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
