<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Register - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- Register -->
<main class="flex-grow flex items-center justify-center px-6 py-16">

    <div class="w-full max-w-lg">

        <div class="bg-white border border-brown/20
                        shadow-sm p-8 md:p-10">

            <div class="text-center mb-8">

                <p class="text-brown uppercase tracking-[0.2em]
                              text-xs font-semibold mb-3">
                    Join the Community
                </p>

                <h1 class="font-serif text-3xl font-bold text-forest">
                    Create Your Account
                </h1>

                <p class="text-gray-600 mt-3 text-sm">
                    Create an account to buy, sell, and exchange books.
                </p>

            </div>


            <form action="/register"
                  method="post"
                  class="space-y-5">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Name -->
                <div>

                    <label for="username"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Name
                    </label>

                    <input id="username"
                           type="text"
                           name="username"
                           required
                           class="w-full border border-brown/30
                                      bg-cream px-4 py-3
                                      text-ink outline-none
                                      focus:border-forest
                                      transition">

                </div>


                <!-- Email -->
                <div>

                    <label for="email"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Email
                    </label>

                    <input id="email"
                           type="email"
                           name="email"
                           required
                           class="w-full border border-brown/30
                                      bg-cream px-4 py-3
                                      text-ink outline-none
                                      focus:border-forest
                                      transition">

                </div>


                <!-- Password -->
                <div>

                    <label for="password"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Password
                    </label>

                    <input id="password"
                           type="password"
                           name="password"
                           required
                           class="w-full border border-brown/30
                                      bg-cream px-4 py-3
                                      text-ink outline-none
                                      focus:border-forest
                                      transition">

                </div>


                <!-- Academic Year -->
                <div>

                    <label for="year"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Academic Year
                    </label>

                    <input id="year"
                           type="number"
                           name="year"
                           min="2000"
                           max="2008"
                           required
                           class="w-full border border-brown/30
                                      bg-cream px-4 py-3
                                      text-ink outline-none
                                      focus:border-forest
                                      transition">

                </div>


                <!-- Submit -->
                <button type="submit"
                        class="w-full bg-forest text-white
                                   py-3 font-semibold
                                   border border-forest
                                   hover:bg-brown hover:border-brown
                                   transition">
                    Create Account
                </button>

            </form>

        </div>

    </div>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
