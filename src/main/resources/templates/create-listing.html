<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Create Listing - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="flex-grow">

    <!-- Header -->
    <section class="max-w-4xl mx-auto px-6 pt-12 pb-8">

        <p class="text-brown uppercase tracking-[0.2em]
                      text-sm font-semibold mb-3">
            Your Books
        </p>

        <h1 class="font-serif text-4xl md:text-5xl
                       font-bold text-forest">
            Create Listing
        </h1>

        <p class="text-gray-600 mt-3">
            Add a book and offer it to other students.
        </p>

    </section>


    <!-- Form -->
    <section class="max-w-4xl mx-auto px-6 pb-16">

        <div class="bg-white border border-brown/20
                        shadow-sm p-8 md:p-10">

            <form action="/listings"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-7">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Book Information -->
                <div>

                    <h2 class="font-serif text-2xl font-bold
                                   text-forest mb-5">
                        Book Information
                    </h2>

                    <div class="grid md:grid-cols-2 gap-5">

                        <!-- Book Title -->
                        <div class="md:col-span-2">

                            <label for="bookTitle"
                                   class="block text-sm font-semibold
                                              text-forest mb-2">
                                Book Title
                            </label>

                            <input id="bookTitle"
                                   type="text"
                                   name="bookTitle"
                                   required
                                   class="w-full border border-brown/30
                                              bg-cream px-4 py-3
                                              outline-none
                                              focus:border-forest transition">

                        </div>


                        <!-- Author -->
                        <div>

                            <label for="author"
                                   class="block text-sm font-semibold
                                              text-forest mb-2">
                                Author
                            </label>

                            <input id="author"
                                   type="text"
                                   name="author"
                                   required
                                   class="w-full border border-brown/30
                                              bg-cream px-4 py-3
                                              outline-none
                                              focus:border-forest transition">

                        </div>


                        <!-- Edition -->
                        <div>

                            <label for="edition"
                                   class="block text-sm font-semibold
                                              text-forest mb-2">
                                Edition
                            </label>

                            <input id="edition"
                                   type="number"
                                   name="edition"
                                   min="1"
                                   required
                                   class="w-full border border-brown/30
                                              bg-cream px-4 py-3
                                              outline-none
                                              focus:border-forest transition">

                        </div>


                        <!-- Course Code -->
                        <div>

                            <label for="courseCode"
                                   class="block text-sm font-semibold
                                              text-forest mb-2">
                                Course Code
                            </label>

                            <input id="courseCode"
                                   type="number"
                                   name="courseCode"
                                   min="1"
                                   required
                                   class="w-full border border-brown/30
                                              bg-cream px-4 py-3
                                              outline-none
                                              focus:border-forest transition">

                        </div>


                        <!-- Category -->
                        <div>

                            <label for="category"
                                   class="block text-sm font-semibold
                                              text-forest mb-2">
                                Category
                            </label>

                            <input id="category"
                                   type="text"
                                   name="category"
                                   required
                                   class="w-full border border-brown/30
                                              bg-cream px-4 py-3
                                              outline-none
                                              focus:border-forest transition">

                        </div>

                    </div>

                </div>


                <div class="border-t border-brown/20"></div>


                <!-- Condition -->
                <div>

                    <h2 class="font-serif text-2xl font-bold
                                   text-forest mb-5">
                        Book Condition
                    </h2>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

                        <label class="border border-brown/30
                                          bg-cream px-4 py-3
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="condition"
                                   value="NEW"
                                   required
                                   class="mr-2">

                            New

                        </label>


                        <label class="border border-brown/30
                                          bg-cream px-4 py-3
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="condition"
                                   value="LIKE_NEW"
                                   class="mr-2">

                            Like New

                        </label>


                        <label class="border border-brown/30
                                          bg-cream px-4 py-3
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="condition"
                                   value="USED"
                                   class="mr-2">

                            Used

                        </label>


                        <label class="border border-brown/30
                                          bg-cream px-4 py-3
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="condition"
                                   value="DAMAGED"
                                   class="mr-2">

                            Damaged

                        </label>

                    </div>

                </div>


                <div class="border-t border-brown/20"></div>


                <!-- Listing Type -->
                <div>

                    <h2 class="font-serif text-2xl font-bold
                                   text-forest mb-5">
                        Listing Type
                    </h2>

                    <div class="flex flex-col sm:flex-row gap-4">

                        <label class="flex-1 border border-brown/30
                                          bg-cream px-5 py-4
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="listingType"
                                   value="SELL"
                                   required
                                   class="mr-2">

                            <strong>Sell</strong>

                            <p class="text-sm text-gray-600 mt-1 ml-6">
                                Offer the book for a price.
                            </p>

                        </label>


                        <label class="flex-1 border border-brown/30
                                          bg-cream px-5 py-4
                                          cursor-pointer
                                          hover:border-forest transition">

                            <input type="radio"
                                   name="listingType"
                                   value="EXCHANGE"
                                   class="mr-2">

                            <strong>Exchange</strong>

                            <p class="text-sm text-gray-600 mt-1 ml-6">
                                Exchange the book with another student.
                            </p>

                        </label>

                    </div>

                </div>


                <!-- Price -->
                <div id="priceContainer">

                    <label for="price"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Price
                    </label>

                    <div class="flex items-center">

                        <input id="price"
                               type="number"
                               name="price"
                               min="0"
                               step="0.01"
                               class="w-full border border-brown/30
                                          bg-cream px-4 py-3
                                          outline-none
                                          focus:border-forest transition">

                        <span class="ml-3 text-gray-600">
                                JD
                            </span>

                    </div>

                </div>


                <div class="border-t border-brown/20"></div>


                <!-- Image -->
                <div>

                    <h2 class="font-serif text-2xl font-bold
                                   text-forest mb-5">
                        Book Image
                    </h2>

                    <label for="image"
                           class="block text-sm font-semibold
                                      text-forest mb-2">
                        Upload an Image
                    </label>

                    <input id="image"
                           type="file"
                           name="image"
                           accept="image/*"
                           class="w-full border border-brown/30
                                      bg-cream px-4 py-3
                                      text-sm">

                    <p class="text-sm text-gray-500 mt-2">
                        Maximum image size: 5MB.
                    </p>

                </div>


                <!-- Error -->
                <p th:if="${error}"
                   th:text="${error}"
                   class="border border-red-300
                              bg-red-50 text-red-700
                              px-4 py-3">
                </p>


                <!-- Submit -->
                <button type="submit"
                        class="w-full bg-forest text-white
                                   py-3 font-semibold
                                   border border-forest
                                   hover:bg-brown hover:border-brown
                                   transition">
                    Create Listing
                </button>

            </form>

        </div>

    </section>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Listing JavaScript -->
<script th:src="@{/js/listing.js}"></script>

</body>
</html>
