<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Create Exchange Proposal - Book Exchange')}">
</head>

<body class="bg-cream text-ink min-h-screen flex flex-col">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="flex-grow">

  <!-- Header -->
  <section class="max-w-3xl mx-auto px-6 pt-12 pb-8">

    <p class="text-brown uppercase tracking-[0.2em]
                      text-sm font-semibold mb-3">
      Book Exchange
    </p>

    <h1 class="font-serif text-4xl md:text-5xl
                       font-bold text-forest">
      Create Exchange Proposal
    </h1>

    <p class="text-gray-600 mt-3">
      Choose one of your available books to offer in exchange.
    </p>

  </section>


  <!-- Form -->
  <section class="max-w-3xl mx-auto px-6 pb-16">

    <div class="bg-white border border-brown/20
                        shadow-sm p-8 md:p-10">

      <form th:action="@{/proposals}"
            method="post"
            class="space-y-7">


        <!-- Requested Listing -->
        <input type="hidden"
               name="requestedListingId"
               th:value="${requestedListingId}">


        <!-- Book Selection -->
        <div>

          <label for="offeredListingId"
                 class="block text-sm font-semibold
                                      text-forest mb-2">
            Select your book to offer
          </label>

          <select id="offeredListingId"
                  name="offeredListingId"
                  required
                  class="w-full border border-brown/30
                                       bg-cream px-4 py-3
                                       outline-none
                                       focus:border-forest transition">

            <option value="">
              Select a book
            </option>

            <option th:each="listing : ${myListings}"
                    th:value="${listing.listingId}"
                    th:text="${listing.bookTitle}">
            </option>

          </select>

          <p class="text-sm text-gray-500 mt-2">
            Only your available exchange listings are shown.
          </p>

        </div>


        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- Actions -->
        <div class="border-t border-brown/20
                                pt-6 flex flex-col sm:flex-row gap-3">

          <button type="submit"
                  class="flex-1 bg-forest text-white
                                       py-3 font-semibold
                                       border border-forest
                                       hover:bg-brown
                                       hover:border-brown transition">
            Send Proposal
          </button>

          <a th:href="@{/listings/all}"
             class="flex-1 text-center
                                  border border-brown
                                  text-brown py-3 font-semibold
                                  hover:bg-brown
                                  hover:text-white transition">
            Cancel
          </a>

        </div>

      </form>

    </div>

  </section>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
